title: "utkarsh@blog"
tagline: "write-ups & notes from the terminal"
description: >-
  Write-ups, notes, and things I learn while practicing on TryHackMe and elsewhere.

url: "https://utkarsh854.github.io"
baseurl: "/blog"

author: Utkarsh
github_username: utkarsh854

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

permalink: /posts/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - "*.gemspec"
